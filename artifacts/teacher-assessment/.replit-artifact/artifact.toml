kind = "mobile"
previewPath = "/"
title = "Teacher Competency Assessment"
description = "A shared Android and Web app for teachers to manage classes, evaluate pupils against configurable objectives, review statistics, and work offline with synchronized assessment drafts."
version = "1.0.0"
id = "artifacts/teacher-assessment"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25464

[services.development]
run = "pnpm --filter @workspace/teacher-assessment run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teacher-assessment", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/teacher-assessment", "run", "serve" ]

[services.env]
PORT = "25464"
BASE_PATH = "/"
